name: SXWIK Linux Console

on:
  workflow_dispatch:
    inputs:
      command:
        description: Guest shell command
        required: true
        type: string
      issue:
        description: Issue number to report back to
        required: false
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sxwik-linux-console
  cancel-in-progress: true

env:
  ALPINE: '3.24.1'
  STATE: linux-state.img
  RAM: 512M
  VIRT_NETBOOT: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/netboot
  KERNEL_VERSION: 6.18.35-0-virt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve command
        id: command
        shell: bash
        env:
          DISPATCH_COMMAND: ${{ inputs.command }}
        run: |
          cmd="$DISPATCH_COMMAND"
          cmd="${cmd//$'\r'/}"
          while [[ "$cmd" == *$'\n' ]]; do cmd="${cmd%$'\n'}"; done
          [[ "$cmd" != *$'\n'* ]] || { echo 'multiline commands are disabled' >&2; exit 1; }
          [ -n "${cmd//[[:space:]]/}" ] || { echo 'empty command' >&2; exit 1; }
          [ ${#cmd} -le 240 ] || { echo 'command too long' >&2; exit 1; }
          printf '%s' "$cmd" > /tmp/command.txt
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: Install VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs curl unzip jq squashfs-tools cpio gzip librsvg2-bin

      - name: Restore persistent disk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select((.name | startswith("sxwik-linux-state-")) and .expired == false) | [.created_at,.archive_download_url] | @tsv' | sort -r | head -n 1 | cut -f2-)
          if [ -n "$url" ]; then
            mkdir -p /tmp/state
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o /tmp/state.zip
            unzip -o /tmp/state.zip -d /tmp/state >/dev/null
            cp /tmp/state/linux-state.img "$STATE"
          else
            curl -fsSL "$VIRT_NETBOOT/../../../releases/x86_64/alpine-minirootfs-3.24.1-x86_64.tar.gz" -o /tmp/alpine.tar.gz
            qemu-img create -f raw "$STATE" 512M >/dev/null
            mkfs.ext4 -q "$STATE"
            sudo mkdir -p /mnt/sxwik-linux
            sudo mount -o loop "$STATE" /mnt/sxwik-linux
            sudo tar xpf /tmp/alpine.tar.gz -C /mnt/sxwik-linux
            sudo umount /mnt/sxwik-linux
          fi
          size=$(stat -c '%s' "$STATE")
          if [ "$size" -lt $((512*1024*1024)) ]; then
            qemu-img resize "$STATE" 512M >/dev/null
            e2fsck -fy "$STATE" >/dev/null
            resize2fs "$STATE" >/dev/null
          fi

      - name: Prepare guest command and Doom runtime
        shell: bash
        run: |
          sudo mkdir -p /mnt/sxwik-linux
          sudo mount -o loop "$STATE" /mnt/sxwik-linux
          sudo install -m 0644 /tmp/command.txt /mnt/sxwik-linux/root/.sxwik-command
          sudo install -m 0755 scripts/doom-input.py /mnt/sxwik-linux/root/doom-input.py
          sudo tee /mnt/sxwik-linux/root/.sxwik-init.sh >/dev/null <<'EOF'
          #!/bin/sh
          set -u
          cd /root
          CMD="$(cat /root/.sxwik-command)"
          echo 'SXWIK LINUX :: shared guest'
          uname -srmo
          printf '\n'
          printf 'sxwik@linux:~$ %s\n' "$CMD"

          is_doom=0
          case "$CMD" in
            [Dd][Oo][Oo][Mm]|[Dd][Oo][Oo][Mm]\ *) is_doom=1 ;;
          esac

          if [ "$is_doom" -eq 1 ]; then
            echo 'SXWIK LINUX :: Doom is running INSIDE Alpine'

            # The Doom stack is installed into the persistent Alpine disk once.
            # Subsequent runs reuse it instead of installing again.
            if ! command -v chocolate-doom >/dev/null 2>&1; then
              echo 'Installing Doom stack in Alpine (first run only)...'
              cat > /etc/apk/repositories <<'REPOS'
          https://dl-cdn.alpinelinux.org/alpine/v3.24/main
          https://dl-cdn.alpinelinux.org/alpine/v3.24/community
          https://dl-cdn.alpinelinux.org/alpine/edge/main
          https://dl-cdn.alpinelinux.org/alpine/edge/community
          https://dl-cdn.alpinelinux.org/alpine/edge/testing
          REPOS
              apk update >/dev/null
              apk add --no-cache python3 chocolate-doom freedoom xvfb xdotool openbox imagemagick x11-utils x11-xkb-utils xkbcomp xkeyboard-config font-cursor-misc font-misc-misc >/dev/null
            fi

            export DISPLAY=:99
            rm -f /root/doom.png
            Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp >/tmp/xvfb.log 2>&1 &
            xvfb_pid=$!
            sleep 1
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp -kb >/tmp/xvfb.log 2>&1 &
              xvfb_pid=$!
              sleep 1
            fi
            openbox >/tmp/openbox.log 2>&1 &
            openbox_pid=$!
            sleep 0.5

            IWAD="$(find /usr/share /usr/local/share -type f -name 'freedoom1.wad' 2>/dev/null | head -n 1)"
            if [ -z "$IWAD" ]; then
              echo 'Freedoom IWAD not found' >&2
              kill "$openbox_pid" "$xvfb_pid" 2>/dev/null || true
              exit 1
            fi

            mkdir -p /root/.doom-saves
            chocolate-doom -iwad "$IWAD" -window -width 1280 -height 720 -nograbmouse -nomusic -nosfx -savedir /root/.doom-saves >/tmp/chocolate-doom.log 2>&1 &
            doom_pid=$!
            export DOOM_WINDOW=''
            python3 /root/doom-input.py "$CMD"
            input_rc=$?
            sleep 0.35

            # Capture the game from the guest X server, then close Doom and return to Alpine.
            import -display "$DISPLAY" -window root -crop 1280x720+0+0 -quality 92 /root/doom.png
            kill "$doom_pid" 2>/dev/null || true
            kill "$openbox_pid" "$xvfb_pid" 2>/dev/null || true
            wait "$doom_pid" 2>/dev/null || true
            echo 'SXWIK DOOM :: closed, returning to Alpine shell'
            echo "SXWIK_DOOM_RC:$input_rc"
            sync
            rc="$input_rc"
          else
            sh -c "$CMD"
            rc=$?
          fi

          printf '\nSXWIK LINUX :: syncing\n'
          sync
          printf 'SXWIK_DONE:%s\n' "$rc"
          sync
          reboot -f
          while :; do sleep 3600; done
          EOF
          sudo chmod 0755 /mnt/sxwik-linux/root/.sxwik-init.sh
          sudo sync
          sudo umount /mnt/sxwik-linux
          sudo e2fsck -fy "$STATE" >/dev/null

      - name: Download matching Alpine kernel, initramfs, and modloop
        run: |
          curl -fsSL "$VIRT_NETBOOT/vmlinuz-virt" -o /tmp/vmlinuz
          curl -fsSL "$VIRT_NETBOOT/initramfs-virt" -o /tmp/initramfs
          curl -fsSL "$VIRT_NETBOOT/modloop-virt" -o /tmp/modloop-virt

      - name: Build minimal initramfs with required modules
        shell: bash
        run: |
          rm -rf /tmp/initrd /tmp/modloop
          mkdir -p /tmp/initrd /tmp/modloop
          gzip -dc /tmp/initramfs | (cd /tmp/initrd && cpio -idm --no-absolute-filenames)
          unsquashfs -f -d /tmp/modloop /tmp/modloop-virt >/dev/null
          moddir="/tmp/modloop/modules/$KERNEL_VERSION"
          test -d "$moddir" || { echo "module directory not found: $moddir" >&2; find /tmp/modloop -maxdepth 3 -type d | sort >&2; exit 1; }
          test -f "$moddir/modules.dep"
          rm -rf /tmp/initrd/lib/modules
          mkdir -p /tmp/initrd/lib/modules
          cp -a "$moddir" /tmp/initrd/lib/modules/
          for applet in mkdir mount sh cat uname sync chroot ip ifconfig udhcpc route; do
            ln -sf /bin/busybox "/tmp/initrd/bin/$applet"
          done
          mkdir -p /tmp/initrd/sbin
          ln -sf /bin/busybox /tmp/initrd/sbin/reboot
          echo "kernel modules copied: $(find "/tmp/initrd/lib/modules/$KERNEL_VERSION" -type f | wc -l)"
          (cd /tmp/initrd && find . -print0 | cpio --null -o -H newc) | gzip -9 > /tmp/initramfs-custom
          test -s /tmp/initramfs-custom
          ls -lh /tmp/initramfs-custom

      - name: Boot Linux and execute command
        shell: bash
        run: |
          rm -f /tmp/qemu.in /tmp/console.log
          mkfifo /tmp/qemu.in
          exec 3<>/tmp/qemu.in
          qemu-system-x86_64 -machine accel=tcg -cpu qemu64 -m "$RAM" -kernel /tmp/vmlinuz -initrd /tmp/initramfs-custom -drive file="$STATE",format=raw,if=virtio -netdev user,id=net0 -device virtio-net-pci,netdev=net0 -append 'console=ttyS0,115200n8 rdinit=/bin/sh' -serial stdio -display none -monitor none -no-reboot <&3 > /tmp/console.log 2>&1 &
          qemu_pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if grep -Eq 'Run /bin/sh as init process|job control turned off' /tmp/console.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/console.log 2>/dev/null || true; kill "$qemu_pid" 2>/dev/null || true; exec 3>&-; wait "$qemu_pid" 2>/dev/null || true; exit 1; fi
          printf 'mount -t devtmpfs devtmpfs /dev\n' >&3
          printf 'modprobe virtio_pci\n' >&3
          printf 'modprobe virtio_blk\n' >&3
          printf 'modprobe virtio_net\n' >&3
          printf 'modprobe ext4\n' >&3
          printf 'ip link set eth0 up\n' >&3
          printf 'udhcpc -i eth0 -q -n\n' >&3
          printf 'mkdir -p /state\n' >&3
          printf 'mount -t ext4 /dev/vda /state\n' >&3
          printf 'chroot /state /root/.sxwik-init.sh\n' >&3
          exec 3>&-
          done=0
          for _ in $(seq 1 150); do
            if grep -q '^SXWIK_DONE:' /tmp/console.log 2>/dev/null; then done=1; break; fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$done" -ne 1 ]; then
            cat /tmp/console.log 2>/dev/null || true
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            echo 'guest did not report completion' >&2
            exit 1
          fi
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test -s /tmp/console.log
          tail -n 140 /tmp/console.log | tr -d '\r' > /tmp/console.tail
          cat /tmp/console.tail
          if ! tr -d '\r' < /tmp/console.log | grep -q '^SXWIK_DONE:0$'; then
            echo 'guest command failed' >&2
            exit 1
          fi

      - name: Extract guest Doom screenshot
        if: ${{ startsWith(steps.command.outputs.command, 'doom ') || steps.command.outputs.command == 'doom' || startsWith(steps.command.outputs.command, 'DOOM ') || steps.command.outputs.command == 'DOOM' }}
        shell: bash
        run: |
          mkdir -p /mnt/sxwik-linux
          sudo mount -o loop,ro "$STATE" /mnt/sxwik-linux
          if [ -f /mnt/sxwik-linux/root/doom.png ]; then
            sudo cp /mnt/sxwik-linux/root/doom.png /tmp/doom.png
          fi
          sudo umount /mnt/sxwik-linux
          test -s /tmp/doom.png

      - name: Render screen
        shell: bash
        run: |
          mkdir -p linux
          if [ -s /tmp/doom.png ]; then
            base64 -w0 /tmp/doom.png > /tmp/doom.b64
            cat > linux/screen.svg <<'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
            <rect width="1280" height="760" rx="18" fill="#050607"/>
            <image x="0" y="40" width="1280" height="720" preserveAspectRatio="none" href="data:image/png;base64,SVGEOF
            cat /tmp/doom.b64 >> linux/screen.svg
            cat >> linux/screen.svg <<'SVGEOF'
          "/>
            <text x="640" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#9aa2ad" letter-spacing="2">SXWIK LINUX :: DOOM INSIDE ALPINE</text>
          </svg>
          SVGEOF
          else
            python - <<'PY'
          import html
          from pathlib import Path
          text = Path('/tmp/console.tail').read_text(errors='replace')
          text = ''.join(c if c in '\n\t' or ord(c) >= 32 else ' ' for c in text)
          lines = [line[:118] for line in text.splitlines()[-42:]]
          rows = '\n'.join(f'<text x="28" y="{82 + i*20}" class="t">{html.escape(line, quote=False)}</text>' for i, line in enumerate(lines))
          height = max(24, len(lines) + 4)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 {height*20+60}" width="1240" height="{height*20+60}"><rect width="100%" height="100%" rx="18" fill="#050607"/><rect x="1" y="1" width="1238" height="{height*20+58}" rx="17" fill="none" stroke="#30343a"/><rect x="0" y="0" width="1240" height="38" rx="18" fill="#0d0f12"/><circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="40" cy="19" r="6" fill="#febc2e"/><circle cx="60" cy="19" r="6" fill="#28c840"/><text x="620" y="24" text-anchor="middle" class="title">SXWIK LINUX :: ttyS0</text><text x="28" y="58" class="meta">ALPINE 3.24.1 · x86_64 · 512 MiB · QEMU · SHARED STATE</text>{rows}<style>.t{{font:14px monospace;fill:#d7dbe0;white-space:pre}}.meta{{font:11px monospace;fill:#7f8792}}.title{{font:11px monospace;fill:#9aa2ad;letter-spacing:2px}}</style></svg>'''
          Path('linux/screen.svg').write_text(svg)
          PY
          fi

      - name: Convert terminal screen to PNG
        if: ${{ !startsWith(steps.command.outputs.command, 'doom ') && steps.command.outputs.command != 'doom' && !startsWith(steps.command.outputs.command, 'DOOM ') && steps.command.outputs.command != 'DOOM' }}
        run: rsvg-convert -w 1240 -o linux/screen.png linux/screen.svg

      - name: Use Doom screenshot as profile PNG
        if: ${{ startsWith(steps.command.outputs.command, 'doom ') || steps.command.outputs.command == 'doom' || startsWith(steps.command.outputs.command, 'DOOM ') || steps.command.outputs.command == 'DOOM' }}
        run: cp /tmp/doom.png linux/screen.png

      - name: Update profile screen and journal
        shell: bash
        env:
          CMD: ${{ steps.command.outputs.command }}
        run: |
          mkdir -p linux
          touch linux/history.log
          printf '%s\n' "$CMD" >> linux/history.log
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('README.md')
          s = p.read_text()
          start = '<img src="./linux/screen.png'
          a = s.find(start)
          if a >= 0:
              b = s.find('>', a)
              s = s[:a] + '<img src="./linux/screen.png?v=' + os.environ['GITHUB_RUN_ID'] + '" width="100%" alt="SXWIK Linux / DOOM">' + s[b+1:]
          p.write_text(s)
          PY
          git config user.name 'sxwik-linux[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md linux/screen.svg linux/screen.png linux/history.log
          git diff --cached --quiet || git commit -m "linux: execute $CMD"
          git push

      - name: Persist VM disk
        uses: actions/upload-artifact@v4
        with:
          name: sxwik-linux-state-${{ github.run_id }}
          path: linux-state.img
          retention-days: 90

      - name: Remove older VM snapshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("sxwik-linux-state-")) | [.id,.created_at] | @tsv' | sort -k2 -r | tail -n +4 | cut -f1 | while read -r id; do [ -z "$id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null || true; done

      - name: Comment result
        if: ${{ inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          CMD: ${{ steps.command.outputs.command }}
        run: gh issue comment "$ISSUE" --body "\`$CMD\` executed inside the shared Alpine Linux guest. Doom, when requested, runs inside that same guest and is closed before the VM syncs."
