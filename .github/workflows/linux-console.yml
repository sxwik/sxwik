name: SXWIK Linux Console

on:
  workflow_dispatch:
    inputs:
      command:
        description: Guest shell command
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sxwik-linux-console
  cancel-in-progress: true

env:
  ALPINE: '3.24.1'
  STATE: linux-state.img
  RAM: 512M
  VIRT_NETBOOT: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/netboot
  KERNEL_VERSION: 6.18.35-0-virt

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
       (github.event.issue.title == '🖥️ SXWIK LINUX CONSOLE' || github.event.issue.title == 'SXWIK LINUX CONSOLE') &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve command
        id: command
        shell: bash
        env:
          DISPATCH_COMMAND: ${{ inputs.command }}
          COMMENT_COMMAND: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then cmd="$DISPATCH_COMMAND"; else cmd="$COMMENT_COMMAND"; fi
          cmd="${cmd//$'\r'/}"
          while [[ "$cmd" == *$'\n' ]]; do cmd="${cmd%$'\n'}"; done
          [[ "$cmd" != *$'\n'* ]] || { echo 'multiline commands are disabled' >&2; exit 1; }
          [ -n "${cmd//[[:space:]]/}" ] || { echo 'empty command' >&2; exit 1; }
          [ ${#cmd} -le 240 ] || { echo 'command too long' >&2; exit 1; }
          printf '%s' "$cmd" > /tmp/command.txt
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: Install VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs curl unzip jq squashfs-tools cpio gzip

      - name: Restore persistent disk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select((.name | startswith("sxwik-linux-state-")) and .expired == false) | [.created_at,.archive_download_url] | @tsv' | sort -r | head -n 1 | cut -f2-)
          if [ -n "$url" ]; then
            mkdir -p /tmp/state
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" -o /tmp/state.zip
            unzip -o /tmp/state.zip -d /tmp/state >/dev/null
            cp /tmp/state/linux-state.img "$STATE"
          else
            curl -fsSL "$VIRT_NETBOOT/../../../releases/x86_64/alpine-minirootfs-3.24.1-x86_64.tar.gz" -o /tmp/alpine.tar.gz
            qemu-img create -f raw "$STATE" 64M >/dev/null
            mkfs.ext4 -q "$STATE"
            sudo mkdir -p /mnt/sxwik-linux
            sudo mount -o loop "$STATE" /mnt/sxwik-linux
            sudo tar xpf /tmp/alpine.tar.gz -C /mnt/sxwik-linux
            sudo umount /mnt/sxwik-linux
          fi

      - name: Prepare guest command
        shell: bash
        run: |
          sudo mkdir -p /mnt/sxwik-linux
          sudo mount -o loop "$STATE" /mnt/sxwik-linux
          sudo install -m 0644 /tmp/command.txt /mnt/sxwik-linux/root/.sxwik-command
          sudo tee /mnt/sxwik-linux/root/.sxwik-init.sh >/dev/null <<'EOF'
          #!/bin/sh
          cd /root
          echo 'SXWIK LINUX :: shared guest'
          uname -srmo
          printf '\n'
          printf 'sxwik@linux:~$ %s\n' "$(cat /root/.sxwik-command)"
          sh -c "$(cat /root/.sxwik-command)"
          rc=$?
          printf '\nSXWIK LINUX :: syncing\n'
          sync
          printf 'SXWIK_DONE:%s\n' "$rc"
          exit "$rc"
          EOF
          sudo chmod 0755 /mnt/sxwik-linux/root/.sxwik-init.sh
          sudo sync
          sudo umount /mnt/sxwik-linux
          sudo e2fsck -fy "$STATE" >/dev/null

      - name: Download matching Alpine kernel, initramfs, and modloop
        run: |
          curl -fsSL "$VIRT_NETBOOT/vmlinuz-virt" -o /tmp/vmlinuz
          curl -fsSL "$VIRT_NETBOOT/initramfs-virt" -o /tmp/initramfs
          curl -fsSL "$VIRT_NETBOOT/modloop-virt" -o /tmp/modloop-virt

      - name: Build minimal initramfs with required modules
        shell: bash
        run: |
          rm -rf /tmp/initrd /tmp/modloop
          mkdir -p /tmp/initrd /tmp/modloop
          gzip -dc /tmp/initramfs | (cd /tmp/initrd && cpio -idm --no-absolute-filenames)
          unsquashfs -f -d /tmp/modloop /tmp/modloop-virt >/dev/null
          moddir="/tmp/modloop/modules/$KERNEL_VERSION"
          test -d "$moddir" || { echo "module directory not found: $moddir" >&2; find /tmp/modloop -maxdepth 3 -type d | sort >&2; exit 1; }
          test -f "$moddir/modules.dep"
          rm -rf /tmp/initrd/lib/modules
          mkdir -p /tmp/initrd/lib/modules
          cp -a "$moddir" /tmp/initrd/lib/modules/
          ln -sf /bin/busybox /tmp/initrd/bin/mkdir
          ln -sf /bin/busybox /tmp/initrd/bin/mount
          echo "kernel modules copied: $(find "/tmp/initrd/lib/modules/$KERNEL_VERSION" -type f | wc -l)"
          (cd /tmp/initrd && find . -print0 | cpio --null -o -H newc) | gzip -9 > /tmp/initramfs-custom
          test -s /tmp/initramfs-custom
          ls -lh /tmp/initramfs-custom

      - name: Boot Linux and execute command
        shell: bash
        run: |
          rm -f /tmp/qemu.in /tmp/console.log
          mkfifo /tmp/qemu.in
          exec 3<>/tmp/qemu.in
          qemu-system-x86_64 -machine accel=tcg -cpu qemu64 -m "$RAM" -kernel /tmp/vmlinuz -initrd /tmp/initramfs-custom -drive file="$STATE",format=raw,if=virtio -append 'console=ttyS0,115200n8 rdinit=/bin/sh' -serial stdio -display none -monitor none -no-reboot <&3 > /tmp/console.log 2>&1 &
          qemu_pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if grep -Eq 'Run /bin/sh as init process|job control turned off' /tmp/console.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/console.log 2>/dev/null || true; kill "$qemu_pid" 2>/dev/null || true; exec 3>&-; wait "$qemu_pid" 2>/dev/null || true; exit 1; fi
          printf 'modprobe virtio_pci\n' >&3
          printf 'modprobe virtio_blk\n' >&3
          printf 'modprobe ext4\n' >&3
          printf 'mkdir -p /state\n' >&3
          printf 'mount -t ext4 /dev/vda /state\n' >&3
          printf 'exec /state/root/.sxwik-init.sh\n' >&3
          exec 3>&-
          done=0
          for _ in $(seq 1 90); do
            if grep -q '^SXWIK_DONE:' /tmp/console.log 2>/dev/null; then done=1; break; fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$done" -ne 1 ]; then
            cat /tmp/console.log 2>/dev/null || true
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            echo 'guest did not report completion' >&2
            exit 1
          fi
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test -s /tmp/console.log
          tail -n 120 /tmp/console.log > /tmp/console.tail
          cat /tmp/console.tail
          grep -q '^SXWIK_DONE:0$' /tmp/console.log || { echo 'guest command failed' >&2; exit 1; }

      - name: Render terminal screen
        shell: python
        run: |
          import html
          from pathlib import Path
          text = Path('/tmp/console.tail').read_text(errors='replace')
          text = ''.join(c if c in '\n\t' or ord(c) >= 32 else ' ' for c in text)
          lines = [line[:118] for line in text.splitlines()[-38:]]
          height = max(24, len(lines) + 4)
          rows = '\n'.join(f'<text x="28" y="{82 + i*20}" class="t">{html.escape(line, quote=False)}</text>' for i, line in enumerate(lines))
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 {height*20+60}" width="1240" height="{height*20+60}"><rect width="100%" height="100%" rx="18" fill="#050607"/><rect x="1" y="1" width="1238" height="{height*20+58}" rx="17" fill="none" stroke="#30343a"/><rect x="0" y="0" width="1240" height="38" rx="18" fill="#0d0f12"/><circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="40" cy="19" r="6" fill="#febc2e"/><circle cx="60" cy="19" r="6" fill="#28c840"/><text x="620" y="24" text-anchor="middle" class="title">SXWIK LINUX :: ttyS0</text><text x="28" y="58" class="meta">ALPINE 3.24.1 · x86_64 · 512 MiB · QEMU · SHARED STATE</text>{rows}<style>.t{{font:14px monospace;fill:#d7dbe0;white-space:pre}}.meta{{font:11px monospace;fill:#7f8792}}.title{{font:11px monospace;fill:#9aa2ad;letter-spacing:2px}}</style></svg>'''
          Path('linux/screen.svg').write_text(svg)

      - name: Update profile screen and journal
        shell: bash
        env:
          CMD: ${{ steps.command.outputs.command }}
        run: |
          mkdir -p linux
          touch linux/history.log
          printf '%s\n' "$CMD" >> linux/history.log
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('README.md')
          s = p.read_text()
          start = '<img src="./linux/screen.svg'
          a = s.find(start)
          if a >= 0:
              b = s.find('>', a)
              s = s[:a] + '<img src="./linux/screen.svg?v=' + os.environ['GITHUB_RUN_ID'] + '" width="100%" alt="SXWIK Linux">' + s[b+1:]
          p.write_text(s)
          PY
          git config user.name 'sxwik-linux[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md linux/screen.svg linux/history.log
          git diff --cached --quiet || git commit -m "linux: execute $CMD"
          git push

      - name: Persist VM disk
        uses: actions/upload-artifact@v4
        with:
          name: sxwik-linux-state-${{ github.run_id }}
          path: linux-state.img
          retention-days: 90

      - name: Remove older VM snapshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("sxwik-linux-state-")) | [.id,.created_at] | @tsv' | sort -k2 -r | tail -n +4 | cut -f1 | while read -r id; do [ -z "$id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null || true; done

      - name: Comment result
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CMD: ${{ steps.command.outputs.command }}
        run: gh issue comment "$ISSUE" --body "\`$CMD\` executed in the shared Linux guest. The profile terminal is updating from the same VM state."
