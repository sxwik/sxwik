name: SXWIK Linux Smoke Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boot:
    if: github.head_ref == 'ci/linux-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPINE: '3.24.1'
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs curl

      - name: Build tiny guest disk
        shell: bash
        run: |
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE%.*}/releases/x86_64/alpine-minirootfs-${ALPINE}-x86_64.tar.gz" -o /tmp/alpine.tar.gz
          qemu-img create -f raw /tmp/linux-state.img 64M >/dev/null
          mkfs.ext4 -q /tmp/linux-state.img
          sudo mkdir -p /mnt/sxwik-linux
          sudo mount -o loop /tmp/linux-state.img /mnt/sxwik-linux
          sudo tar xpf /tmp/alpine.tar.gz -C /mnt/sxwik-linux
          sudo umount /mnt/sxwik-linux

      - name: Boot Linux and assert echo hello
        shell: bash
        run: |
          base="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE%.*}/releases/x86_64/netboot"
          curl -fsSL "$base/vmlinuz-virt" -o /tmp/vmlinuz
          curl -fsSL "$base/initramfs-virt" -o /tmp/initramfs

          printf '%s\n' \
            'echo SXWIK_BOOT_OK' \
            'echo hello' \
            'sync' \
            'halt -f' > /tmp/guest-input

          set +e
          timeout 60s qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu qemu64 \
            -m 256M \
            -kernel /tmp/vmlinuz \
            -initrd /tmp/initramfs \
            -drive file=/tmp/linux-state.img,format=raw,if=virtio \
            -append 'root=/dev/vda rw modules=virtio_blk,ext4 rootfstype=ext4 console=ttyS0,115200n8 init=/bin/sh' \
            -serial stdio \
            -display none \
            -monitor none \
            -no-reboot < /tmp/guest-input > /tmp/console.log 2>&1
          rc=$?
          set -e

          cat /tmp/console.log
          test "$rc" -ne 124
          grep -q 'SXWIK_BOOT_OK' /tmp/console.log
          grep -q '^hello$' /tmp/console.log
