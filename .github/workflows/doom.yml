name: SXWIK DOOM

on:
  workflow_dispatch:
    inputs:
      command:
        description: Doom input program
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sxwik-linux-console
  cancel-in-progress: true

jobs:
  doom:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.command == 'doom' || startsWith(github.event.inputs.command, 'doom '))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
       (github.event.issue.title == '🖥️ SXWIK LINUX CONSOLE' || github.event.issue.title == 'SXWIK LINUX CONSOLE') &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.body == 'doom' || startsWith(github.event.comment.body, 'doom ')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DISPLAY: ':99'
      DOOM_COMMAND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.command || github.event.comment.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Doom program
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, shlex
          command = os.environ['DOOM_COMMAND'].replace('\r', '').strip()
          if '\n' in command or not re.fullmatch(r'doom(?:\s+.*)?', command, re.I):
              raise SystemExit('Doom command must be a single line starting with doom')
          if len(command) > 240:
              raise SystemExit('Doom command is limited to 240 characters')
          tokens = shlex.split(command[4:].strip())
          if len(tokens) > 80:
              raise SystemExit('Doom program is limited to 80 actions')
          print(f'validated Doom program: {len(tokens)} actions')
          PY

      - name: Install Doom stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chocolate-doom freedoom xvfb xdotool imagemagick

      - name: Locate Freedoom IWAD
        shell: bash
        run: |
          IWAD=$(find /usr/share -type f \( -iname 'freedoom1.wad' -o -iname 'freedoom1.wad.gz' -o -iname 'doom1.wad' \) 2>/dev/null | head -n 1)
          [ -n "$IWAD" ] || { echo 'Freedoom IWAD not found' >&2; find /usr/share -iname '*freedoom*' -o -iname '*.wad' 2>/dev/null | head -n 50; exit 1; }
          case "$IWAD" in
            *.gz) gunzip -c "$IWAD" > /tmp/freedoom1.wad; IWAD=/tmp/freedoom1.wad ;;
          esac
          echo "IWAD=$IWAD" >> "$GITHUB_ENV"
          echo "Using $IWAD"

      - name: Start virtual display
        shell: bash
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          echo $! >/tmp/xvfb.pid
          for _ in $(seq 1 20); do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 0.25
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 || { cat /tmp/xvfb.log; exit 1; }

      - name: Boot Chocolate Doom
        shell: bash
        run: |
          mkdir -p /tmp/doom-home
          export HOME=/tmp/doom-home
          export SDL_VIDEODRIVER=x11
          nohup chocolate-doom \
            -iwad "$IWAD" \
            -window \
            -width 1280 \
            -height 720 \
            -nograbmouse \
            -nomusic \
            -nosfx \
            -savedir /tmp/doom-home/saves \
            >/tmp/chocolate-doom.log 2>&1 &
          echo $! >/tmp/doom.pid
          for _ in $(seq 1 40); do
            if xdotool search --onlyvisible --name 'Chocolate Doom' >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          xdotool search --onlyvisible --name 'Chocolate Doom' >/dev/null 2>&1 || { cat /tmp/chocolate-doom.log; exit 1; }
          sleep 0.5

      - name: Execute stacked Doom inputs
        env:
          DOOM_COMMAND: ${{ env.DOOM_COMMAND }}
        run: python3 scripts/doom-input.py "$DOOM_COMMAND"

      - name: Capture Doom screen
        shell: bash
        run: |
          sleep 0.25
          import -display "$DISPLAY" -window root -crop 1280x720+0+0 -quality 92 linux/screen.png
          test -s linux/screen.png
          file linux/screen.png

      - name: Stop Doom
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/doom.pid ]; then kill "$(cat /tmp/doom.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/xvfb.pid ]; then kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true; fi

      - name: Update profile screen and journal
        shell: bash
        env:
          CMD: ${{ env.DOOM_COMMAND }}
        run: |
          mkdir -p linux
          touch linux/history.log
          printf '%s\n' "$CMD" >> linux/history.log
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('README.md')
          s = p.read_text()
          start = '<img src="./linux/screen.png'
          a = s.find(start)
          if a >= 0:
              b = s.find('>', a)
              s = s[:a] + '<img src="./linux/screen.png?v=' + os.environ['GITHUB_RUN_ID'] + '" width="100%" alt="SXWIK Linux / DOOM">' + s[b+1:]
          p.write_text(s)
          PY
          git config user.name 'sxwik-linux[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md linux/screen.png linux/history.log
          git diff --cached --quiet || git commit -m "doom: execute input program"
          git push

      - name: Comment result
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CMD: ${{ env.DOOM_COMMAND }}
        run: gh issue comment "$ISSUE" --body "\`$CMD\` rendered in Chocolate Doom. The profile screen now shows the captured game state."
