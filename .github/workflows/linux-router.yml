name: SXWIK Linux Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

jobs:
  dispatch-linux:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.issue.title == '🖥️ SXWIK LINUX CONSOLE' || github.event.issue.title == 'SXWIK LINUX CONSOLE') &&
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, 'doom')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Linux Console
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMD: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh workflow run linux-console.yml --ref main -f command="$CMD" -f issue="$ISSUE"
          gh issue comment "$ISSUE" --body "Linux command queued in the persistent guest."
