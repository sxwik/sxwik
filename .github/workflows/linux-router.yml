name: SXWIK Linux Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

jobs:
  dispatch-linux:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.issue.title == '🖥️ SXWIK LINUX CONSOLE' || github.event.issue.title == 'SXWIK LINUX CONSOLE') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Linux Console
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMD: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          lower_cmd="${CMD,,}"
          if [[ "$lower_cmd" == doom || "$lower_cmd" == doom\ * ]]; then
            gh issue comment "$ISSUE" --body "This console is Linux-only. Submit a Linux shell command instead."
            exit 0
          fi
          gh api --method POST \
            "repos/$REPO/actions/workflows/linux-console.yml/dispatches" \
            -f ref=main \
            -f "inputs[command]=$CMD" \
            -f "inputs[issue]=$ISSUE"
          gh issue comment "$ISSUE" --body "Linux command queued in the persistent Alpine guest."
